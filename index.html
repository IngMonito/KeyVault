<!DOCTYPE html>
<html lang="es">

<head>
  <title>KeyVault</title>
  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #1a237e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .contenedor {
      background-color: white;
      padding: 40px;
      border-radius: 12px;
      width: 400px;
      text-align: center;
    }

    h1 {
      color: #1a237e;
      font-size: 28px;
      margin-bottom: 5px;
    }

    p {
      color: gray;
      margin-bottom: 25px;
    }

    label {
      display: block;
      text-align: left;
      font-weight: bold;
      color: #1a237e;
      margin-bottom: 5px;
      margin-top: 15px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    input:focus {
      border-color: #1a237e;
      outline: none;
    }

    span.error {
      color: red;
      font-size: 12px;
      display: block;
      text-align: left;
      margin-top: 3px;
    }

    button {
      margin-top: 25px;
      width: 100%;
      padding: 12px;
      background-color: #1a237e;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #283593;
    }

    #mensaje-error {
      color: red;
      font-size: 13px;
      margin-top: 15px;
      display: none;
    }

  </style>
</head>

<body>

  <div class="contenedor">

    <h1>🔐 KeyVault</h1>
    <p>Gestor de Contraseñas</p>

    <label>Correo electrónico</label>
    <input type="email" id="correo" placeholder="ejemplo@correo.com">
    <span class="error" id="error-correo"></span>

    <label>Contraseña maestra</label>
    <input type="password" id="contrasena" placeholder="Tu contraseña">
    <span class="error" id="error-contrasena"></span>

    <button onclick="iniciarSesion()">Iniciar sesión</button>

    <p id="mensaje-error"></p>

  </div>

  <script>

    // Verificar si ya hay sesión activa
    if (localStorage.getItem('token')) {
      window.location.href = 'dashboard.html';
    }

    async function iniciarSesion() {

      // Limpiar errores
      document.getElementById('error-correo').textContent = '';
      document.getElementById('error-contrasena').textContent = '';
      document.getElementById('mensaje-error').style.display = 'none';

      const correo = document.getElementById('correo').value.trim();
      const contrasena = document.getElementById('contrasena').value.trim();

      // Validaciones locales
      let hayErrores = false;

      if (correo === '') {
        document.getElementById('error-correo').textContent = 'El correo es obligatorio';
        hayErrores = true;
      } else if (!correo.includes('@')) {
        document.getElementById('error-correo').textContent = 'El correo no es válido';
        hayErrores = true;
      }

      if (contrasena === '') {
        document.getElementById('error-contrasena').textContent = 'La contraseña es obligatoria';
        hayErrores = true;
      } else if (contrasena.length < 6) {
        document.getElementById('error-contrasena').textContent = 'Mínimo 6 caracteres';
        hayErrores = true;
      }

      if (hayErrores) return;

      // Llamada a la API
      try {
        const respuesta = await fetch('http://localhost:3000/api/usuarios/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ correo, contrasenaMaestra: contrasena })
        });

        const datos = await respuesta.json();

        if (!respuesta.ok) {
          const error = document.getElementById('mensaje-error');
          error.textContent = datos.error || 'Error al iniciar sesión';
          error.style.display = 'block';
          return;
        }

        // Guardar token y redirigir
        localStorage.setItem('token', datos.token);
        window.location.href = 'dashboard.html';

      } catch (err) {
        const error = document.getElementById('mensaje-error');
        error.textContent = 'No se pudo conectar con el servidor';
        error.style.display = 'block';
      }
    }

  </script>

</body>
</html>
