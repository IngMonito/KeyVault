<!DOCTYPE html>
<html lang="es">

<head>
  <title>KeyVault - Dashboard</title>
  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #3949ab 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .header h1 {
      color: white;
      font-size: 32px;
      margin-bottom: 5px;
    }

    .header p {
      color: rgba(255,255,255,0.7);
      font-size: 14px;
    }

    .contenido {
      max-width: 900px;
      margin: 0 auto;
    }

    .formulario {
      background: rgba(255,255,255,0.98);
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      margin-bottom: 30px;
    }

    .formulario h2 {
      color: #1a237e;
      font-size: 20px;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #f0f4ff;
    }

    label {
      display: block;
      font-weight: 600;
      color: #1a237e;
      margin-bottom: 6px;
      margin-top: 15px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e8eaf6;
      border-radius: 10px;
      font-size: 14px;
      transition: border-color 0.3s;
      background-color: #fafafa;
    }

    input:focus, select:focus {
      border-color: #1a237e;
      outline: none;
      background-color: white;
    }

    span.error {
      color: #c62828;
      font-size: 12px;
      display: block;
      margin-top: 4px;
    }

    button.btn-guardar {
      margin-top: 25px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #1a237e, #3949ab);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button.btn-guardar:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(26,35,126,0.4);
    }

    .seccion-lista h2 {
      color: white;
      font-size: 20px;
      margin-bottom: 20px;
    }

    .lista {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 15px;
    }

    .tarjeta {
      background: rgba(255,255,255,0.98);
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }

    .tarjeta:hover {
      transform: translateY(-3px);
    }

    .tarjeta h3 {
      color: #1a237e;
      margin-bottom: 8px;
      font-size: 16px;
    }

    .tarjeta p {
      color: #666;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      margin-top: 10px;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-redes { background-color: #ede7f6; color: #6a1b9a; }
    .badge-trabajo { background-color: #fff8e1; color: #f57f17; }
    .badge-bancos { background-color: #e8f5e9; color: #2e7d32; }

    .botones-tarjeta {
      display: flex;
      gap: 8px;
    }

    .btn-eliminar {
      flex: 1;
      padding: 8px;
      background-color: #ffebee;
      color: #c62828;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    .btn-eliminar:hover {
      background-color: #ffcdd2;
    }

    .btn-editar {
      flex: 1;
      padding: 8px;
      background-color: #e3f2fd;
      color: #1565c0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    .btn-editar:hover {
      background-color: #bbdefb;
    }

    .vacio {
      color: rgba(255,255,255,0.7);
      font-style: italic;
      text-align: center;
      padding: 30px;
    }

  </style>
</head>

<body>

  <div class="contenido">

    <div class="header">
      <h1>🔐 KeyVault</h1>
      <p>Gestor de Contraseñas</p>
    </div>

    <div class="formulario">
      <h2>Nueva contraseña</h2>

      <label>Nombre del servicio</label>
      <input type="text" id="servicio" placeholder="Ej: Facebook">
      <span class="error" id="error-servicio"></span>

      <label>Usuario o correo</label>
      <input type="text" id="usuario" placeholder="Ej: samuel@correo.com">
      <span class="error" id="error-usuario"></span>

      <label>Contraseña</label>
      <input type="password" id="contrasena" placeholder="Contraseña del servicio">
      <span class="error" id="error-contrasena"></span>

      <label>Categoría</label>
      <select id="categoria">
        <option value="">Selecciona una categoría</option>
        <option value="redes">Redes Sociales</option>
        <option value="trabajo">Trabajo</option>
        <option value="bancos">Bancos</option>
      </select>
      <span class="error" id="error-categoria"></span>

      <button class="btn-guardar" onclick="guardar()">Guardar contraseña</button>
    </div>

    <div class="seccion-lista">
      <h2>Mis contraseñas</h2>
      <div class="lista" id="lista"></div>
    </div>

  </div>

  <script>

    let indiceEdicion = -1;

    mostrarLista();

    function guardar() {

      document.getElementById("error-servicio").textContent = "";
      document.getElementById("error-usuario").textContent = "";
      document.getElementById("error-contrasena").textContent = "";
      document.getElementById("error-categoria").textContent = "";

      let servicio = document.getElementById("servicio").value.trim();
      let usuario = document.getElementById("usuario").value.trim();
      let contrasena = document.getElementById("contrasena").value.trim();
      let categoria = document.getElementById("categoria").value;

      let hayErrores = false;

      if (servicio === "") {
        document.getElementById("error-servicio").textContent = "El nombre del servicio es obligatorio";
        hayErrores = true;
      }

      if (usuario === "") {
        document.getElementById("error-usuario").textContent = "El usuario es obligatorio";
        hayErrores = true;
      }

      if (contrasena === "") {
        document.getElementById("error-contrasena").textContent = "La contraseña es obligatoria";
        hayErrores = true;
      } else if (contrasena.length < 6) {
        document.getElementById("error-contrasena").textContent = "Mínimo 6 caracteres";
        hayErrores = true;
      }

      if (categoria === "") {
        document.getElementById("error-categoria").textContent = "Selecciona una categoría";
        hayErrores = true;
      }

      if (hayErrores) return;

      let lista = JSON.parse(localStorage.getItem("contrasenas")) || [];

      if (indiceEdicion === -1) {
        lista.push({ servicio, usuario, contrasena, categoria });
      } else {
        lista[indiceEdicion] = { servicio, usuario, contrasena, categoria };
        indiceEdicion = -1;
        document.querySelector(".btn-guardar").textContent = "Guardar contraseña";
      }

      localStorage.setItem("contrasenas", JSON.stringify(lista));

      document.getElementById("servicio").value = "";
      document.getElementById("usuario").value = "";
      document.getElementById("contrasena").value = "";
      document.getElementById("categoria").value = "";

      mostrarLista();
    }

    function mostrarLista() {

      let lista = JSON.parse(localStorage.getItem("contrasenas")) || [];
      let contenedor = document.getElementById("lista");
      contenedor.innerHTML = "";

      if (lista.length === 0) {
        contenedor.innerHTML = "<p class='vacio'>No hay contraseñas guardadas todavía.</p>";
        return;
      }

      lista.forEach(function(item, indice) {

        let badgeClase = "";
        let badgeTexto = "";

        if (item.categoria === "redes") { badgeClase = "badge-redes"; badgeTexto = "Redes Sociales"; }
        if (item.categoria === "trabajo") { badgeClase = "badge-trabajo"; badgeTexto = "Trabajo"; }
        if (item.categoria === "bancos") { badgeClase = "badge-bancos"; badgeTexto = "Bancos"; }

        let tarjeta = document.createElement("div");
        tarjeta.className = "tarjeta";
        tarjeta.innerHTML = `
          <h3>${item.servicio}</h3>
          <p>👤 ${item.usuario}</p>
          <p>🔑 ${"•".repeat(item.contrasena.length)}</p>
          <span class="badge ${badgeClase}">${badgeTexto}</span>
          <div class="botones-tarjeta">
            <button class="btn-editar" onclick="editar(${indice})">✏️ Editar</button>
            <button class="btn-eliminar" onclick="eliminar(${indice})">🗑️ Eliminar</button>
          </div>
        `;

        contenedor.appendChild(tarjeta);
      });
    }

    function eliminar(indice) {
      let lista = JSON.parse(localStorage.getItem("contrasenas")) || [];
      lista.splice(indice, 1);
      localStorage.setItem("contrasenas", JSON.stringify(lista));
      mostrarLista();
    }

    function editar(indice) {
      let lista = JSON.parse(localStorage.getItem("contrasenas")) || [];
      let item = lista[indice];

      document.getElementById("servicio").value = item.servicio;
      document.getElementById("usuario").value = item.usuario;
      document.getElementById("contrasena").value = item.contrasena;
      document.getElementById("categoria").value = item.categoria;

      indiceEdicion = indice;
      document.querySelector(".btn-guardar").textContent = "Actualizar contraseña";

      window.scrollTo(0, 0);
    }

  </script>

</body>
</html>
