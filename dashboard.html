<!DOCTYPE html>
<html lang="es">

<head>
  <title>KeyVault - Dashboard</title>
  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #3949ab 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .header h1 {
      color: white;
      font-size: 32px;
      margin-bottom: 5px;
    }

    .header p {
      color: rgba(255,255,255,0.7);
      font-size: 14px;
    }

    .btn-cerrar {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.2);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-cerrar:hover {
      background: rgba(255,255,255,0.3);
    }

    .contenido {
      max-width: 900px;
      margin: 0 auto;
    }

    .formulario {
      background: rgba(255,255,255,0.98);
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      margin-bottom: 30px;
    }

    .formulario h2 {
      color: #1a237e;
      font-size: 20px;
      margin-bottom: 21px;
      padding-bottom: 10px;
      border-bottom: 2px solid #f0f4ff;
    }

    label {
      display: block;
      font-weight: 600;
      color: #1a237e;
      margin-bottom: 6px;
      margin-top: 15px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e8eaf6;
      border-radius: 10px;
      font-size: 14px;
      transition: border-color 0.3s;
      background-color: #fafafa;
    }

    input:focus, select:focus {
      border-color: #1a237e;
      outline: none;
      background-color: white;
    }

    span.error {
      color: #c62828;
      font-size: 12px;
      display: block;
      margin-top: 4px;
    }

    button.btn-guardar {
      margin-top: 25px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #1a237e, #3949ab);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button.btn-guardar:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(26,35,126,0.4);
    }

    .seccion-lista h2 {
      color: white;
      font-size: 20px;
      margin-bottom: 20px;
    }

    .lista {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 15px;
    }

    .tarjeta {
      background: rgba(255,255,255,0.98);
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }

    .tarjeta:hover {
      transform: translateY(-3px);
    }

    .tarjeta h3 {
      color: #1a237e;
      margin-bottom: 8px;
      font-size: 16px;
    }

    .tarjeta p {
      color: #666;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .botones-tarjeta {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .btn-eliminar {
      flex: 1;
      padding: 8px;
      background-color: #ffebee;
      color: #c62828;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .btn-eliminar:hover { background-color: #ffcdd2; }

    .btn-editar {
      flex: 1;
      padding: 8px;
      background-color: #e3f2fd;
      color: #1565c0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .btn-editar:hover { background-color: #bbdefb; }

    .vacio {
      color: rgba(255,255,255,0.7);
      font-style: italic;
      text-align: center;
      padding: 30px;
    }

    #mensaje-form {
      margin-top: 10px;
      font-size: 13px;
      text-align: center;
    }

  </style>
</head>

<body>

  <button class="btn-cerrar" onclick="cerrarSesion()">Cerrar sesión</button>

  <div class="contenido">

    <div class="header">
      <h1>🔐 KeyVault</h1>
      <p>Gestor de Contraseñas</p>
    </div>

    <div class="formulario">
      <h2 id="titulo-form">Nueva contraseña</h2>

      <label>Nombre del servicio</label>
      <input type="text" id="servicio" placeholder="Ej: Facebook">
      <span class="error" id="error-servicio"></span>

      <label>Usuario o correo</label>
      <input type="text" id="usuario" placeholder="Ej: samuel@correo.com">

      <label>Contraseña</label>
      <input type="password" id="contrasena" placeholder="Contraseña del servicio">
      <span class="error" id="error-contrasena"></span>

      <label>URL del servicio (opcional)</label>
      <input type="text" id="url" placeholder="Ej: https://facebook.com">

      <label>Notas (opcional)</label>
      <input type="text" id="notas" placeholder="Ej: Cuenta personal">

      <button class="btn-guardar" onclick="guardar()">Guardar contraseña</button>
      <p id="mensaje-form"></p>
    </div>

    <div class="seccion-lista">
      <h2>Mis contraseñas</h2>
      <div class="lista" id="lista"></div>
    </div>

  </div>

  <script>

    const API = 'http://localhost:3000/api';
    let idEdicion = null;

    // Verificar sesión
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = 'index.html';
    }

    // Cargar contraseñas al iniciar
    cargarContrasenas();

    async function cargarContrasenas() {
      try {
        const respuesta = await fetch(`${API}/contrasenas`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (respuesta.status === 401) {
          cerrarSesion();
          return;
        }

        const datos = await respuesta.json();
        mostrarLista(datos);
      } catch (err) {
        console.error('Error cargando contraseñas:', err);
      }
    }

    function mostrarLista(lista) {
      const contenedor = document.getElementById('lista');
      contenedor.innerHTML = '';

      if (lista.length === 0) {
        contenedor.innerHTML = "<p class='vacio'>No hay contraseñas guardadas todavía.</p>";
        return;
      }

      lista.forEach(item => {
        const tarjeta = document.createElement('div');
        tarjeta.className = 'tarjeta';
        tarjeta.innerHTML = `
          <h3>${item.nombre_servicio}</h3>
          <p>👤 ${item.usuario_servicio || '-'}</p>
          <p>🔑 ${'•'.repeat(8)}</p>
          <p>🌐 ${item.url_servicio || '-'}</p>
          <p>📝 ${item.notas || '-'}</p>
          <div class="botones-tarjeta">
            <button class="btn-editar" onclick="editar(${item.id_entrada})">✏️ Editar</button>
            <button class="btn-eliminar" onclick="eliminar(${item.id_entrada})">🗑️ Eliminar</button>
          </div>
        `;
        contenedor.appendChild(tarjeta);
      });
    }

    async function guardar() {
      document.getElementById('error-servicio').textContent = '';
      document.getElementById('error-contrasena').textContent = '';
      document.getElementById('mensaje-form').textContent = '';

      const servicio = document.getElementById('servicio').value.trim();
      const usuario = document.getElementById('usuario').value.trim();
      const contrasena = document.getElementById('contrasena').value.trim();
      const url = document.getElementById('url').value.trim();
      const notas = document.getElementById('notas').value.trim();

      let hayErrores = false;

      if (!servicio) {
        document.getElementById('error-servicio').textContent = 'El nombre del servicio es obligatorio';
        hayErrores = true;
      }

      if (!contrasena) {
        document.getElementById('error-contrasena').textContent = 'La contraseña es obligatoria';
        hayErrores = true;
      }

      if (hayErrores) return;

      const body = {
        nombreServicio: servicio,
        usuarioServicio: usuario,
        contrasenaCifrada: contrasena,
        urlServicio: url,
        notas: notas
      };

      try {
        const metodo = idEdicion ? 'PUT' : 'POST';
        const url_endpoint = idEdicion ? `${API}/contrasenas/${idEdicion}` : `${API}/contrasenas`;

        const respuesta = await fetch(url_endpoint, {
          method: metodo,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(body)
        });

        const datos = await respuesta.json();

        if (!respuesta.ok) {
          document.getElementById('mensaje-form').textContent = datos.error;
          return;
        }

        document.getElementById('mensaje-form').style.color = 'green';
        document.getElementById('mensaje-form').textContent = idEdicion ? '✅ Actualizada correctamente' : '✅ Guardada correctamente';

        limpiarFormulario();
        cargarContrasenas();

      } catch (err) {
        document.getElementById('mensaje-form').textContent = 'Error al conectar con el servidor';
      }
    }

    async function eliminar(id) {
      if (!confirm('¿Seguro que quieres eliminar esta contraseña?')) return;

      try {
        const respuesta = await fetch(`${API}/contrasenas/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (respuesta.ok) {
          cargarContrasenas();
        }
      } catch (err) {
        console.error('Error eliminando:', err);
      }
    }

    async function editar(id) {
      try {
        const respuesta = await fetch(`${API}/contrasenas`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const lista = await respuesta.json();
        const item = lista.find(c => c.id_entrada === id);

        if (!item) return;

        document.getElementById('servicio').value = item.nombre_servicio;
        document.getElementById('usuario').value = item.usuario_servicio || '';
        document.getElementById('contrasena').value = item.contrasena_cifrada;
        document.getElementById('url').value = item.url_servicio || '';
        document.getElementById('notas').value = item.notas || '';

        idEdicion = id;
        document.getElementById('titulo-form').textContent = 'Editar contraseña';
        document.querySelector('.btn-guardar').textContent = 'Actualizar contraseña';
        window.scrollTo(0, 0);

      } catch (err) {
        console.error('Error cargando para editar:', err);
      }
    }

    function limpiarFormulario() {
      document.getElementById('servicio').value = '';
      document.getElementById('usuario').value = '';
      document.getElementById('contrasena').value = '';
      document.getElementById('url').value = '';
      document.getElementById('notas').value = '';
      idEdicion = null;
      document.getElementById('titulo-form').textContent = 'Nueva contraseña';
      document.querySelector('.btn-guardar').textContent = 'Guardar contraseña';
    }

    function cerrarSesion() {
      localStorage.removeItem('token');
      window.location.href = 'index.html';
    }

  </script>

</body>
</html>
